<style>
  /* ============ ATHLAH BRAND PALETTE ============ */
  :root {
    --brand-green:      #114d4f;      /* dark green — primary */
    --brand-green-2:    #0d3d3f;      /* deeper shade for hovers */
    --brand-green-soft: #1a6567;      /* lighter shade for accents */
    --brand-beige:      #F4EADF;      /* beige — secondary / surfaces */
    --brand-beige-2:    #EDE0D0;      /* slightly darker beige for inputs */
    --brand-beige-3:    #FBF5EC;      /* lightest beige */
    --complete-green:   #4A9D5F;      /* brighter green for completion */
    --complete-green-2: #3d8450;
    --ink:              #1a2e23;      /* main text */
    --ink-dim:          #5a6e62;
    --ink-faint:        #8a9890;
    --danger:           #B84A3B;
    --warn:             #D89547;
    --urgent:           #9C2B1E;
    --line:             #d9cdbc;
    --line-strong:      #c4b69f;
    --shadow-sm:        0 1px 2px rgba(17,77,79,0.08);
    --shadow-md:        0 4px 12px rgba(17,77,79,0.12);
    --shadow-lg:        0 10px 28px rgba(17,77,79,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--brand-beige);
    color: var(--ink);
    font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(17,77,79,0.04), transparent 60%),
      var(--brand-beige);
  }

  /* ============ HEADER ============ */
  .topbar {
    background: var(--brand-green);
    color: var(--brand-beige-3);
    padding: 18px 0;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: var(--brand-beige-3);
    flex-shrink: 0;
  }
  .brand-logo svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.3px;
    line-height: 1;
    color: var(--brand-beige-3);
  }
  .brand-sub {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(251, 245, 236, 0.65);
    margin-top: 5px;
  }

  .sync-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: rgba(251, 245, 236, 0.1);
    border: 1px solid rgba(251, 245, 236, 0.2);
    border-radius: 999px;
    font-size: 12px;
    color: var(--brand-beige-3);
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .sync-dot.live { background: var(--complete-green); animation: pulse 2s infinite; }
  .sync-dot.down { background: var(--danger); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,157,95,0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(74,157,95,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,157,95,0); }
  }

  /* ============ APP LAYOUT ============ */
  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 28px 80px;
  }

  .setup-banner {
    display: none;
    background: #fbeae6;
    border: 1px solid #e8b5ac;
    color: #6d2318;
    padding: 14px 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .setup-banner.show { display: block; }
  .setup-banner code {
    background: rgba(0,0,0,0.07);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    padding: 4px;
    background: var(--brand-beige-2);
    border-radius: 12px;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    min-width: max-content;
    padding: 10px 18px;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font: inherit;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--brand-beige-3);
    background: var(--brand-green);
    box-shadow: var(--shadow-sm);
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.28s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--brand-green);
  }

  /* ============ BUTTONS ============ */
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    font: inherit;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--brand-green);
    color: var(--brand-beige-3);
  }
  .btn-primary:hover { background: var(--brand-green-2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-dim);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover { color: var(--brand-green); background: var(--brand-beige-3); }

  .btn-icon {
    padding: 6px 10px;
    background: var(--brand-beige-3);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .btn-icon:hover { color: var(--brand-green); border-color: var(--brand-green); }
  .btn-danger:hover { color: var(--danger); border-color: var(--danger); }

  /* ============ CARDS ============ */
  .card {
    background: var(--brand-beige-3);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 10px;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--brand-green);
    flex: 1;
  }
  .card-desc {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 14px;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  /* ============ BADGES ============ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: var(--brand-beige-2);
    color: var(--ink-dim);
    border: 1px solid var(--line);
  }
  .badge.status-active       { color: var(--brand-green);     background: #d9ebeb; border-color: #a8c9c9; }
  .badge.status-pending      { color: #8a5a20;                background: #faedd3; border-color: #e3ce9e; }
  .badge.status-in_progress  { color: #8a5a20;                background: #faedd3; border-color: #e3ce9e; }
  .badge.status-done         { color: var(--complete-green-2); background: #dbeedf; border-color: #a6cfb1; }
  .badge.pri-low     { color: var(--ink-dim); }
  .badge.pri-medium  { color: var(--brand-green); background: #d9ebeb; border-color: #a8c9c9; }
  .badge.pri-high    { color: var(--danger);      background: #faddd6; border-color: #e8b1a4; }
  .badge.pri-urgent  { color: #fff; background: var(--urgent); border-color: var(--urgent); letter-spacing: 0.8px; }

  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ============ NESTED HIERARCHY ============ */
  .milestones { margin-top: 14px; padding-left: 20px; border-left: 2px dashed var(--line-strong); }
  .tasks      { margin-top: 10px; padding-left: 18px; border-left: 2px dotted var(--line-strong); }

  .sub-card {
    background: var(--brand-beige-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .sub-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .sub-card-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }
  .sub-card-title.done {
    text-decoration: line-through;
    color: var(--ink-faint);
  }
  .task-card {
    background: var(--brand-beige-3);
  }

  /* ============ PROGRESS BAR ============ */
  .progress {
    height: 6px;
    background: var(--brand-beige-2);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 10px;
    border: 1px solid var(--line);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--brand-green), var(--complete-green));
    transition: width 0.4s ease;
    border-radius: 99px;
  }
  .progress-text {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 4px;
    font-weight: 500;
  }

  /* ============ STATUS CIRCLE (tappable) ============ */
  .status-circle {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    border: 2px solid var(--line-strong);
    background: var(--brand-beige-3);
    cursor: pointer;
    position: relative;
    transition: all 0.15s ease;
    display: grid;
    place-items: center;
    margin-top: 2px;
  }
  .status-circle:hover { border-color: var(--brand-green); transform: scale(1.08); }
  .status-circle.pending      { background: var(--brand-beige-3); }
  .status-circle.in_progress  { background: var(--warn); border-color: var(--warn); }
  .status-circle.in_progress::after {
    content: '';
    width: 10px; height: 10px;
    background: var(--brand-beige-3);
    border-radius: 50%;
  }
  .status-circle.done {
    background: var(--complete-green);
    border-color: var(--complete-green);
  }
  .status-circle.done::after {
    content: '✓';
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  /* ============ MODAL ============ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 77, 79, 0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.open { display: flex; animation: fadeIn 0.2s ease; }

  .modal {
    background: var(--brand-beige-3);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--brand-green);
    margin-bottom: 20px;
  }

  .form-field { margin-bottom: 14px; }
  .form-field label {
    display: block;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .form-field input,
  .form-field textarea,
  .form-field select {
    width: 100%;
    padding: 10px 12px;
    background: var(--brand-beige-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    transition: border-color 0.15s ease;
  }
  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--brand-green);
    background: var(--brand-beige-3);
  }
  .form-field textarea { resize: vertical; min-height: 70px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  /* ============ EMPTY STATE ============ */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
    background: var(--brand-beige-3);
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
  }
  .empty-icon { font-size: 36px; opacity: 0.35; margin-bottom: 12px; color: var(--brand-green); }

  /* ============ REMINDER BOX ============ */
  .reminder-box {
    background: var(--brand-beige-3);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
  }
  .reminder-box pre {
    font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--brand-beige-2);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .reminder-box .reminder-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .reminder-box .reminder-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .batch-reminder { margin-top: 14px; }
  .batch-reminder .reminder-box + .reminder-box { margin-top: 8px; }

  /* ============ STAFF ============ */
  .staff-stats {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }
  .staff-stat {
    flex: 1;
    background: var(--brand-beige-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .staff-stat-num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--brand-green);
    line-height: 1;
  }
  .staff-stat-label {
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
    font-weight: 600;
  }

  /* ============ STARS ============ */
  .stars { display: inline-flex; gap: 2px; }
  .star {
    font-size: 20px;
    color: var(--line-strong);
    cursor: pointer;
    transition: color 0.15s ease;
    user-select: none;
  }
  .star.on { color: #e3a52b; }
  .star:hover { color: #d49220; }
  .rating-display {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-dim);
    font-weight: 500;
  }
  .rating-number {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--brand-green);
  }

  .review-entry {
    background: var(--brand-beige-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .review-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* Arabic text direction */
  .rtl { direction: rtl; text-align: right; }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    .topbar-inner { padding: 0 16px; flex-wrap: wrap; }
    .app { padding: 20px 16px 60px; }
    .brand-logo { width: 38px; height: 38px; }
    .brand-title { font-size: 18px; }
    .brand-sub { font-size: 9px; letter-spacing: 2px; }
    .sync-pill { font-size: 11px; padding: 6px 10px; }
    .form-row { grid-template-columns: 1fr; }
    .panel-title { font-size: 22px; }
    .card { padding: 16px; }
    .sub-card-head { flex-direction: column; }
    .card-actions { width: 100%; }
    .staff-stats { flex-direction: row; }
  }
</style>
</head>

        <div class="brand-title">Athlah Staff Management</div>
        <div class="brand-sub">Goals &middot; Milestones &middot; Tasks</div>
      </div>
    </div>
    <div class="sync-pill" id="syncPill">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Connecting&hellip;</span>

  </div>

<div class="app">
  <div id="setupBanner" class="setup-banner"></div>

  <nav class="tabs">
    <button class="tab active" data-panel="goals">Goals</button>
    <button class="tab" data-panel="staff">Staff</button>
    <button class="tab" data-panel="performance">Performance</button>
    <button class="tab" data-panel="reminders">Reminders</button>
  </nav>

  <section class="panel active" id="panel-goals">
    <div class="panel-head">
      <div class="panel-title">Goals</div>
      <button class="btn btn-primary" onclick="openGoalModal()">+ New Goal</button>
    </div>
    <div id="goalsList"></div>
  </section>

  <section class="panel" id="panel-staff">
    <div class="panel-head">
      <div class="panel-title">Staff</div>
      <button class="btn btn-primary" onclick="openStaffModal()">+ New Member</button>
    </div>
    <div id="staffList"></div>
  </section>

  <section class="panel" id="panel-performance">
    <div class="panel-head">
      <div class="panel-title">Performance</div>
      <button class="btn btn-primary" onclick="openReviewModal()">+ New Review</button>
    </div>
    <div id="performanceList"></div>
  </section>

  <section class="panel" id="panel-reminders">
    <div class="panel-head">
      <div class="panel-title">Reminder Composer</div>
    </div>
    <div class="card">
      <div class="form-field">
        <label>Staff Member</label>
        <select id="rmStaff"></select>
      </div>
      <div class="form-field">
        <label>Task</label>
        <select id="rmTask"></select>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Language</label>
          <select id="rmLang">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
        </div>
        <div class="form-field">
          <label>Channel</label>
          <select id="rmChannel">
            <option value="whatsapp">WhatsApp</option>
            <option value="email">Email</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="generateReminder()">Generate Message</button>
      <div id="reminderOut"></div>
    </div>
  </section>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-bg" id="goalModal">
  <div class="modal">
    <div class="modal-title" id="goalModalTitle">New Goal</div>
    <input type="hidden" id="goalId">
    <div class="form-field"><label>Title</label><input type="text" id="goalTitle" placeholder="Launch Cohort 5"></div>
    <div class="form-field"><label>Description</label><textarea id="goalDesc"></textarea></div>
    <div class="form-row">
      <div class="form-field"><label>Owner</label><select id="goalOwner"><option value="">&mdash; none &mdash;</option></select></div>
      <div class="form-field"><label>Target Date</label><input type="date" id="goalDue"></div>
    </div>
    <div class="form-field">
      <label>Status</label>
      <select id="goalStatus">
        <option value="active">Active</option>
        <option value="pending">Pending</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('goalModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveGoal()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="milestoneModal">
  <div class="modal">
    <div class="modal-title" id="milestoneModalTitle">New Milestone</div>
    <input type="hidden" id="mGoalId">
    <input type="hidden" id="mId">
    <div class="form-field"><label>Title</label><input type="text" id="mTitle" placeholder="Finalize curriculum"></div>
    <div class="form-field"><label>Description</label><textarea id="mDesc"></textarea></div>
    <div class="form-row">
      <div class="form-field">
        <label>Status</label>
        <select id="mStatus">
          <option value="pending">Pending</option>
          <option value="active">Active</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-field"><label>Due Date</label><input type="date" id="mDue"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('milestoneModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveMilestone()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="taskModal">
  <div class="modal">
    <div class="modal-title" id="taskModalTitle">New Task</div>
    <input type="hidden" id="tMilestoneId">
    <input type="hidden" id="tId">
    <div class="form-field"><label>Title</label><input type="text" id="tTitle"></div>
    <div class="form-field"><label>Description</label><textarea id="tDesc"></textarea></div>
    <div class="form-row">

<script>
// ============================================================
// Supabase client
// ============================================================
const { createClient } = supabase;
const sb = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

const state = {
  goals: [],
  milestones: [],
  tasks: [],
  staff: [],
  reviews: [],
  rvRating: 0
};

const BUILTIN_ROLES = ['Researcher', 'Editor', 'Marketing', 'Operations', 'Finance', 'Support'];

// ============================================================
// Sync status
// ============================================================
function setSync(mode, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.classList.remove('live', 'down');
  if (mode === 'live') dot.classList.add('live');
  if (mode === 'down') dot.classList.add('down');
  txt.textContent = text;
}

function showSetupBanner(msg) {
  const b = document.getElementById('setupBanner');
  b.innerHTML = msg;
  b.classList.add('show');
}

// ============================================================
// Data loading
// ============================================================
async function loadAll() {
  try {
    setSync('', 'Loading\u2026');
    const [g, m, t, s, r] = await Promise.all([
      sb.from('goals').select('*').order('created_at', { ascending: false }),
      sb.from('milestones').select('*').order('created_at', { ascending: true }),
      sb.from('tasks').select('*').order('created_at', { ascending: true }),
      sb.from('staff').select('*').order('name', { ascending: true }),
      sb.from('performance_reviews').select('*').order('created_at', { ascending: false })
    ]);

    const err = g.error || m.error || t.error || s.error || r.error;
    if (err) {
      if (err.message && err.message.indexOf('does not exist') !== -1) {
        showSetupBanner('<strong>Database not set up yet.</strong> Open your Supabase project \u2192 <em>SQL Editor</em> \u2192 paste the contents of <code>athlah_supabase_setup.sql</code> \u2192 click Run. Then reload this page.');
      } else {
        showSetupBanner('<strong>Connection error:</strong> ' + err.message);
      }
      setSync('down', 'Offline');
      return;
    }

    state.goals      = g.data || [];
    state.milestones = m.data || [];
    state.tasks      = t.data || [];
    state.staff      = s.data || [];
    state.reviews    = r.data || [];
    renderAll();
    setSync('live', 'Live \u00b7 synced');
  } catch (e) {
    console.error(e);
    setSync('down', 'Offline');
    showSetupBanner('<strong>Connection failed:</strong> ' + e.message);
  }
}

function subscribeAll() {
  sb.channel('athlah-all')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'goals' },               () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'milestones' },          () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' },               () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'staff' },               () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'performance_reviews' }, () => loadAll())
    .subscribe();
}

// ============================================================
// Helpers
// ============================================================
function staffById(id) {
  return state.staff.find(x => x.id === id);
}
function staffName(id) {
  const s = staffById(id);
  return s ? s.name : '\u2014';
}
function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function milestoneProgress(milestoneId) {
  const ts = state.tasks.filter(t => t.milestone_id === milestoneId);
  if (ts.length === 0) return { done: 0, total: 0, pct: 0 };
  const done = ts.filter(t => t.status === 'done').length;
  return { done, total: ts.length, pct: Math.round((done / ts.length) * 100) };
}
function goalProgress(goalId) {
  const ms = state.milestones.filter(m => m.goal_id === goalId);
  if (ms.length === 0) return { pct: 0, done: 0, total: 0 };
  let totalTasks = 0;
  let doneTasks  = 0;
  ms.forEach(m => {
    const p = milestoneProgress(m.id);
    totalTasks += p.total;
    doneTasks  += p.done;
  });
  if (totalTasks === 0) return { pct: 0, done: 0, total: 0 };
  return { pct: Math.round((doneTasks / totalTasks) * 100), done: doneTasks, total: totalTasks };
}
function statusLabel(s) {
  return { pending: 'Pending', in_progress: 'In Progress', active: 'Active', done: 'Done' }[s] || s;
}
function priorityLabel(p) {
  return { low: 'Low', medium: 'Medium', high: 'High', urgent: 'Urgent' }[p] || p;
}
function nextTaskStatus(current) {
  // pending -> in_progress -> done -> pending
  if (current === 'pending') return 'in_progress';
  if (current === 'in_progress') return 'done';
  return 'pending';
}

// ============================================================
// Rendering
// ============================================================
function renderAll() {
  renderGoals();
  renderStaff();
  renderPerformance();
  renderReminderSelects();
  renderReviewStaffSelect();
}

function renderGoals() {
  const list = document.getElementById('goalsList');
  if (state.goals.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">&#9671;</div>No goals yet. Create your first one to begin.</div>';
    return;
  }

  list.innerHTML = state.goals.map(g => {
    const ms  = state.milestones.filter(m => m.goal_id === g.id);
    const gp  = goalProgress(g.id);
    const progressHTML = gp.total > 0
      ? '<div class="progress"><div class="progress-bar" style="width:' + gp.pct + '%"></div></div>' +
        '<div class="progress-text">' + gp.pct + '% complete \u00b7 ' + gp.done + ' of ' + gp.total + ' tasks</div>'
      : '';

    return '<div class="card">' +
      '<div class="card-head">' +
        '<div style="flex:1">' +
          '<div class="card-title">' + escapeHTML(g.title) + '</div>' +
          (g.description ? '<div class="card-desc">' + escapeHTML(g.description) + '</div>' : '') +
          '<div class="card-meta">' +
            '<span class="badge status-' + g.status + '">' + statusLabel(g.status) + '</span>' +
            (g.owner_id ? '<span class="badge">Owner: ' + escapeHTML(staffName(g.owner_id)) + '</span>' : '') +
            (g.due_date ? '<span class="badge">Target ' + fmtDate(g.due_date) + '</span>' : '') +
          '</div>' +
          progressHTML +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" onclick="openMilestoneModal(\'' + g.id + '\')">+ Milestone</button>' +
          '<button class="btn-icon" onclick="editGoal(\'' + g.id + '\')">Edit</button>' +
          '<button class="btn-icon btn-danger" onclick="deleteGoal(\'' + g.id + '\')">Delete</button>' +
        '</div>' +
      '</div>' +
      (ms.length ? '<div class="milestones">' + ms.map(renderMilestone).join('') + '</div>' : '') +
    '</div>';
  }).join('');
}

function renderMilestone(m) {
  const ts  = state.tasks.filter(t => t.milestone_id === m.id);
  const mp  = milestoneProgress(m.id);
  const hasIncomplete = ts.some(t => t.status !== 'done');
  const progressHTML = mp.total > 0
    ? '<div class="progress"><div class="progress-bar" style="width:' + mp.pct + '%"></div></div>' +
      '<div class="progress-text">' + mp.pct + '% \u00b7 ' + mp.done + '/' + mp.total + ' tasks done</div>'
    : '';

  return '<div class="sub-card">' +
    '<div class="sub-card-head">' +
      '<div style="flex:1">' +
        '<div class="sub-card-title ' + (m.status === 'done' ? 'done' : '') + '">' + escapeHTML(m.title) + '</div>' +
        (m.description ? '<div class="card-desc" style="margin-top:4px;margin-bottom:8px;font-size:13px">' + escapeHTML(m.description) + '</div>' : '') +
        '<div class="card-meta">' +
          '<span class="badge status-' + m.status + '">' + statusLabel(m.status) + '</span>' +
          (m.due_date ? '<span class="badge">Due ' + fmtDate(m.due_date) + '</span>' : '') +
        '</div>' +
        progressHTML +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn-icon" onclick="openTaskModal(\'' + m.id + '\')">+ Task</button>' +
        (hasIncomplete ? '<button class="btn-icon" onclick="remindAllInMilestone(\'' + m.id + '\')" title="Generate reminders for all incomplete tasks">&#128233; Remind All</button>' : '') +
        '<button class="btn-icon" onclick="editMilestone(\'' + m.id + '\')">Edit</button>' +
        '<button class="btn-icon btn-danger" onclick="deleteMilestone(\'' + m.id + '\')">Delete</button>' +
      '</div>' +
    '</div>' +
    (ts.length ? '<div class="tasks">' + ts.map(renderTask).join('') + '</div>' : '') +
  '</div>';
}

function renderTask(t) {
  return '<div class="sub-card task-card">' +
    '<div class="sub-card-head">' +
      '<div class="status-circle ' + t.status + '" onclick="cycleTaskStatus(\'' + t.id + '\')" title="Click to cycle status"></div>' +
      '<div style="flex:1">' +
        '<div class="sub-card-title ' + (t.status === 'done' ? 'done' : '') + '">' + escapeHTML(t.title) + '</div>' +
        (t.description ? '<div class="card-desc" style="margin-top:4px;margin-bottom:8px;font-size:13px">' + escapeHTML(t.description) + '</div>' : '') +
        '<div class="card-meta">' +
          '<span class="badge status-' + t.status + '">' + statusLabel(t.status) + '</span>' +
          '<span class="badge pri-' + t.priority + '">' + priorityLabel(t.priority) + '</span>' +
          (t.assignee_id ? '<span class="badge">' + escapeHTML(staffName(t.assignee_id)) + '</span>' : '') +
          (t.due_date ? '<span class="badge">Due ' + fmtDate(t.due_date) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn-icon" onclick="remindForTask(\'' + t.id + '\')" title="Generate reminder">&#128233;</button>' +
        '<button class="btn-icon" onclick="editTask(\'' + t.id + '\')">Edit</button>' +
        '<button class="btn-icon btn-danger" onclick="deleteTask(\'' + t.id + '\')">Delete</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderStaff() {
  const list = document.getElementById('staffList');
  if (state.staff.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">&#9671;</div>No staff yet. Add your first team member.</div>';
  } else {
    list.innerHTML = state.staff.map(s => {
      const assigned = state.tasks.filter(t => t.assignee_id === s.id).length;
      const done     = state.tasks.filter(t => t.assignee_id === s.id && t.status === 'done').length;
      const reviews  = state.reviews.filter(r => r.staff_id === s.id);
      const avgRating = reviews.length
        ? (reviews.reduce((a, r) => a + r.rating, 0) / reviews.length).toFixed(1)
        : null;

      return '<div class="card">' +
        '<div class="card-head">' +
          '<div style="flex:1">' +
            '<div class="card-title">' + escapeHTML(s.name) + '</div>' +
            (s.role ? '<div class="card-desc">' + escapeHTML(s.role) + '</div>' : '') +
            '<div class="card-meta">' +
              (s.email ? '<span class="badge">' + escapeHTML(s.email) + '</span>' : '') +
              (s.phone ? '<span class="badge">' + escapeHTML(s.phone) + '</span>' : '') +
              '<span class="badge">' + (s.language === 'ar' ? 'العربية' : 'English') + '</span>' +
            '</div>' +
            '<div class="staff-stats">' +
              '<div class="staff-stat"><div class="staff-stat-num">' + assigned + '</div><div class="staff-stat-label">Assigned</div></div>' +
              '<div class="staff-stat"><div class="staff-stat-num">' + done + '</div><div class="staff-stat-label">Completed</div></div>' +
              '<div class="staff-stat"><div class="staff-stat-num">' + (avgRating || '\u2014') + '</div><div class="staff-stat-label">Avg Rating</div></div>' +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="btn-icon" onclick="editStaff(\'' + s.id + '\')">Edit</button>' +
            '<button class="btn-icon btn-danger" onclick="deleteStaff(\'' + s.id + '\')">Delete</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Populate owner/assignee selects
  const opts = '<option value="">\u2014 none \u2014</option>' +
    state.staff.map(s => '<option value="' + s.id + '">' + escapeHTML(s.name) + '</option>').join('');
  document.getElementById('goalOwner').innerHTML = opts;
  document.getElementById('tAssignee').innerHTML = opts;
}

function renderPerformance() {
  const list = document.getElementById('performanceList');
  if (state.staff.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">&#9671;</div>Add staff members first, then leave performance reviews.</div>';
    return;
  }

  list.innerHTML = state.staff.map(s => {
    const reviews = state.reviews.filter(r => r.staff_id === s.id);
    const avg = reviews.length ? (reviews.reduce((a, r) => a + r.rating, 0) / reviews.length) : 0;
    const avgStr = reviews.length ? avg.toFixed(1) : '\u2014';
    const starStr = reviews.length ? renderStaticStars(Math.round(avg)) : '';

    const history = reviews.length
      ? reviews.map(r => (
          '<div class="review-entry">' +
            '<div class="review-meta">' +
              '<span>' + renderStaticStars(r.rating) + '</span>' +
              '<span>' + (r.reviewer ? escapeHTML(r.reviewer) + ' \u00b7 ' : '') + fmtDate(r.created_at) + '</span>' +
            '</div>' +
            (r.note ? '<div style="font-size:13px;color:var(--ink);line-height:1.5">' + escapeHTML(r.note) + '</div>' : '') +
            '<div style="margin-top:8px;text-align:right">' +
              '<button class="btn-icon btn-danger" onclick="deleteReview(\'' + r.id + '\')">Delete</button>' +
            '</div>' +
          '</div>'
        )).join('')
      : '<div style="color:var(--ink-dim);font-size:13px;padding:6px 0">No reviews yet.</div>';

    return '<div class="card">' +
      '<div class="card-head">' +
        '<div style="flex:1">' +
          '<div class="card-title">' + escapeHTML(s.name) + '</div>' +
          (s.role ? '<div class="card-desc">' + escapeHTML(s.role) + '</div>' : '') +
          '<div class="rating-display">' +
            starStr +
            '<span class="rating-number">' + avgStr + '</span>' +
            '<span>&nbsp;/ 5 \u00b7 ' + reviews.length + ' review' + (reviews.length === 1 ? '' : 's') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" onclick="openReviewModal(\'' + s.id + '\')">+ Review</button>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:14px">' + history + '</div>' +
    '</div>';
  }).join('');
}

function renderStaticStars(n) {
  let out = '<span class="stars">';
  for (let i = 1; i <= 5; i++) {
    out += '<span class="star' + (i <= n ? ' on' : '') + '">\u2605</span>';
  }
  out += '</span>';
  return out;
}

function renderReminderSelects() {
  document.getElementById('rmStaff').innerHTML = '<option value="">\u2014 select \u2014</option>' +
    state.staff.map(s => '<option value="' + s.id + '">' + escapeHTML(s.name) + '</option>').join('');
  document.getElementById('rmTask').innerHTML = '<option value="">\u2014 select \u2014</option>' +
    state.tasks.map(t => '<option value="' + t.id + '">' + escapeHTML(t.title) + '</option>').join('');
}

function renderReviewStaffSelect() {
  document.getElementById('rvStaff').innerHTML = '<option value="">\u2014 select \u2014</option>' +
    state.staff.map(s => '<option value="' + s.id + '">' + escapeHTML(s.name) + '</option>').join('');
}

// ============================================================
// Tabs
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// ============================================================
// Modal helpers
// ============================================================
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ============================================================
// Goals
// ============================================================
function openGoalModal() {
  document.getElementById('goalModalTitle').textContent = 'New Goal';
  document.getElementById('goalId').value = '';
  document.getElementById('goalTitle').value = '';
  document.getElementById('goalDesc').value = '';
  document.getElementById('goalOwner').value = '';
  document.getElementById('goalDue').value = '';
  document.getElementById('goalStatus').value = 'active';
  openModal('goalModal');
}
function editGoal(id) {
  const g = state.goals.find(x => x.id === id);
  if (!g) return;
  document.getElementById('goalModalTitle').textContent = 'Edit Goal';
  document.getElementById('goalId').value = g.id;
  document.getElementById('goalTitle').value = g.title || '';
  document.getElementById('goalDesc').value = g.description || '';
  document.getElementById('goalOwner').value = g.owner_id || '';
  document.getElementById('goalDue').value = g.due_date || '';
  document.getElementById('goalStatus').value = g.status || 'active';
  openModal('goalModal');
}
async function saveGoal() {
  const id = document.getElementById('goalId').value;
  const payload = {
    title:       document.getElementById('goalTitle').value.trim(),
    description: document.getElementById('goalDesc').value.trim() || null,
    owner_id:    document.getElementById('goalOwner').value || null,
    due_date:    document.getElementById('goalDue').value || null,
    status:      document.getElementById('goalStatus').value,
    updated_at:  new Date().toISOString()
  };
  if (!payload.title) return alert('Title required');
  const res = id
    ? await sb.from('goals').update(payload).eq('id', id)
    : await sb.from('goals').insert(payload);
  if (res.error) return alert('Error: ' + res.error.message);
  closeModal('goalModal');
  loadAll();
}
async function deleteGoal(id) {
  if (!confirm('Delete this goal and all its milestones/tasks?')) return;
  const { error } = await sb.from('goals').delete().eq('id', id);
  if (error) alert('Error: ' + error.message); else loadAll();
}

// ============================================================
// Milestones
// ============================================================
function openMilestoneModal(goalId) {
  document.getElementById('milestoneModalTitle').textContent = 'New Milestone';
  document.getElementById('mGoalId').value = goalId;
  document.getElementById('mId').value = '';
  document.getElementById('mTitle').value = '';
  document.getElementById('mDesc').value = '';
  document.getElementById('mStatus').value = 'pending';
  document.getElementById('mDue').value = '';
  openModal('milestoneModal');
}
function editMilestone(id) {
  const m = state.milestones.find(x => x.id === id);
  if (!m) return;
  document.getElementById('milestoneModalTitle').textContent = 'Edit Milestone';
  document.getElementById('mGoalId').value = m.goal_id;
  document.getElementById('mId').value = m.id;
  document.getElementById('mTitle').value = m.title || '';
  document.getElementById('mDesc').value = m.description || '';
  document.getElementById('mStatus').value = m.status || 'pending';
  document.getElementById('mDue').value = m.due_date || '';
  openModal('milestoneModal');
}
async function saveMilestone() {
  const id = document.getElementById('mId').value;
  const payload = {
    goal_id:     document.getElementById('mGoalId').value,
    title:       document.getElementById('mTitle').value.trim(),

function onRoleSelectChange() {

  if (sel === '__custom__') {

function openStaffModal() {
  document.getElementById('staffModalTitle').textContent = 'New Staff Member';
  document.getElementById('sId').value = '';
  document.getElementById('sName').value = '';
  document.getElementById('sRoleSelect').value = 'Researcher';
  document.getElementById('sRoleCustom').value = '';
  document.getElementById('sRoleCustomField').style.display = 'none';
  document.getElementById('sEmail').value = '';
  document.getElementById('sPhone').value = '';
  document.getElementById('sLang').value = 'en';
  openModal('staffModal');
}
function editStaff(id) {
  const s = state.staff.find(x => x.id === id);
  if (!s) return;
  document.getElementById('staffModalTitle').textContent = 'Edit Staff Member';
  document.getElementById('sId').value = s.id;
  document.getElementById('sName').value = s.name || '';

  // Role: if one of the built-ins, select it; otherwise custom
  const role = s.role || '';
  if (BUILTIN_ROLES.indexOf(role) !== -1) {
    document.getElementById('sRoleSelect').value = role;
    document.getElementById('sRoleCustom').value = '';
    document.getElementById('sRoleCustomField').style.display = 'none';
  } else if (role) {
    document.getElementById('sRoleSelect').value = '__custom__';
    document.getElementById('sRoleCustom').value = role;
    document.getElementById('sRoleCustomField').style.display = 'block';
  } else {
    document.getElementById('sRoleSelect').value = 'Researcher';
    document.getElementById('sRoleCustom').value = '';
    document.getElementById('sRoleCustomField').style.display = 'none';
  }

  document.getElementById('sEmail').value = s.email || '';
  document.getElementById('sPhone').value = s.phone || '';
  document.getElementById('sLang').value = s.language || 'en';
  openModal('staffModal');

// ============================================================
// Reminders
// ============================================================
function buildReminderMessage(task, staff, lang) {
  const m = state.milestones.find(x => x.id === task.milestone_id);
  const g = m ? state.goals.find(x => x.id === m.goal_id) : null;
  const dueStr = task.due_date ? fmtDate(task.due_date) : (lang === 'ar' ? 'بدون تاريخ محدد' : 'no specific date');

  if (lang === 'ar') {
    return 'مرحباً ' + staff.name + '،\n\nتذكير ودّي بشأن المهمة التالية:\n\n' +
      '• المهمة: ' + task.title + '\n' +
      (g ? '• الهدف: ' + g.title + '\n' : '') +
      (m ? '• المرحلة: ' + m.title + '\n' : '') +
      '• تاريخ الاستحقاق: ' + dueStr + '\n' +
      '• الأولوية: ' + ({ low: 'منخفضة', medium: 'متوسطة', high: 'عالية', urgent: 'عاجلة' }[task.priority] || task.priority) + '\n' +
      (task.description ? '\n' + task.description + '\n' : '') +
      '\nشكراً لجهودك.\nفريق Athlah';
  }
  return 'Hi ' + staff.name + ',\n\nA friendly reminder about the following task:\n\n' +
    '\u2022 Task: ' + task.title + '\n' +
    (g ? '\u2022 Goal: ' + g.title + '\n' : '') +
    (m ? '\u2022 Milestone: ' + m.title + '\n' : '') +
    '\u2022 Due: ' + dueStr + '\n' +
    '\u2022 Priority: ' + priorityLabel(task.priority) + '\n' +
    (task.description ? '\n' + task.description + '\n' : '') +
    '\nThanks for your work.\nAthlah Team';
}

function reminderBoxHTML(task, staff, msg, lang) {
  const whatsappLink = staff.phone
    ? '<a class="btn btn-primary" style="text-decoration:none" target="_blank" href="https://wa.me/' + staff.phone.replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(msg) + '">&#128242; WhatsApp</a>'
    : '';
  const emailLink = staff.email
    ? '<a class="btn btn-primary" style="text-decoration:none" href="mailto:' + staff.email + '?subject=' + encodeURIComponent('Reminder: ' + task.title) + '&body=' + encodeURIComponent(msg) + '">&#9993;&#65039; Email</a>'
    : '';
  const copyBtn = '<button class="btn btn-ghost" onclick="copyToClipboard(this, ' + JSON.stringify(msg).replace(/"/g, '&quot;') + ')">Copy</button>';

  const warning = (!staff.phone && !staff.email)
    ? '<div style="color:var(--warn);margin-top:8px;font-size:12px">No contact info on file for this person.</div>'
    : '';

  return '<div class="reminder-box">' +
    '<div class="reminder-label">' + escapeHTML(staff.name) + ' \u00b7 ' + (lang === 'ar' ? 'العربية' : 'English') + '</div>' +
    '<pre class="' + (lang === 'ar' ? 'rtl' : '') + '">' + escapeHTML(msg) + '</pre>' +
    '<div class="reminder-actions">' + copyBtn + whatsappLink + emailLink + '</div>' +
    warning +
  '</div>';
}

function copyToClipboard(btn, text) {
  const original = btn.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  }).catch(() => {
    btn.textContent = 'Copy failed';
  });
}

function generateReminder() {
  const staffId = document.getElementById('rmStaff').value;
  const taskId  = document.getElementById('rmTask').value;
  const lang    = document.getElementById('rmLang').value;
  const out     = document.getElementById('reminderOut');

  if (!staffId || !taskId) {
    out.innerHTML = '<div class="reminder-box"><div style="color:var(--ink-dim);font-size:13px">Pick a staff member and a task first.</div></div>';
    return;
  }
  const s = staffById(staffId);
  const t = state.tasks.find(x => x.id === taskId);
  const msg = buildReminderMessage(t, s, lang);
  out.innerHTML = reminderBoxHTML(t, s, msg, lang);
}

// Per-task quick reminder (📩 button on a task)
function remindForTask(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  if (!t.assignee_id) {
    alert('This task has no assignee. Edit the task to assign it first.');
    return;
  }
  const s = staffById(t.assignee_id);
  if (!s) return;
  const lang = s.language === 'ar' ? 'ar' : 'en';
  const msg = buildReminderMessage(t, s, lang);
  const content = reminderBoxHTML(t, s, msg, lang);
  document.getElementById('batchReminderContent').innerHTML = content;
  openModal('batchReminderModal');
}

// Batch: all incomplete tasks under a milestone
function remindAllInMilestone(milestoneId) {
  const m = state.milestones.find(x => x.id === milestoneId);
  if (!m) return;
  const tasks = state.tasks.filter(t => t.milestone_id === milestoneId && t.status !== 'done');
  if (tasks.length === 0) {
    alert('No incomplete tasks in this milestone.');
    return;
  }
  const unassigned = tasks.filter(t => !t.assignee_id);
  const assigned   = tasks.filter(t => t.assignee_id);

  let html = '<div style="font-size:13px;color:var(--ink-dim);margin-bottom:14px">' +
             'Milestone: <strong style="color:var(--brand-green)">' + escapeHTML(m.title) + '</strong> \u00b7 ' +
             assigned.length + ' reminder' + (assigned.length === 1 ? '' : 's') + ' to send</div>';

  if (assigned.length === 0) {
    html += '<div class="empty">All incomplete tasks here have no assignee. Assign them first.</div>';
  } else {
    html += '<div class="batch-reminder">';
    assigned.forEach(t => {
      const s = staffById(t.assignee_id);
      if (!s) return;
      const lang = s.language === 'ar' ? 'ar' : 'en';
      const msg  = buildReminderMessage(t, s, lang);
      html += '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)">' +
              '<div style="font-family:\'Fraunces\',serif;font-size:15px;font-weight:600;color:var(--brand-green);margin-bottom:8px">' +
              escapeHTML(t.title) + '</div>' +
              reminderBoxHTML(t, s, msg, lang) +
              '</div>';
    });
    html += '</div>';
  }

  if (unassigned.length > 0) {
    html += '<div style="margin-top:14px;padding:12px;background:var(--brand-beige-2);border-radius:8px;font-size:13px;color:var(--ink-dim)">' +
            '<strong style="color:var(--warn)">' + unassigned.length + ' task' + (unassigned.length === 1 ? '' : 's') +
            ' skipped</strong> (no assignee):<br>' +
            unassigned.map(t => '\u2022 ' + escapeHTML(t.title)).join('<br>') +
            '</div>';
  }

  document.getElementById('batchReminderContent').innerHTML = html;
  openModal('batchReminderModal');
}

// Close modals on backdrop click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => {
    if (e.target === bg) bg.classList.remove('open');
  });
});
